# The shockwave, its exponential falloff, burning structures, the mushroom cloud and radiation all come from
# the Aftermath warhead. Peak damage is twenty times the stock Atomic's core; the blast reaches 54 cells.
MegaNuke:
	ValidTargets: Ground, Water, GroundActor, WaterActor, Underwater, AirborneActor, Trees
	Warhead@Flash: FlashEffect
		FlashType: MegaNuke
		Duration: 75
	Warhead@Shake: ShakeScreen
		Duration: 80
		Intensity: 14
		Multiplier: 2,2
	Warhead@Sound: CreateEffect
		ImpactSounds: kaboom1.aud
		ImpactActors: false
		ValidTargets: Ground, Water, Air
	Warhead@Aftermath: NuclearAftermath
		ValidTargets: Ground, Water, Air
		Versus:
			Wood: 12
			Concrete: 8
			Tree: 200
	Warhead@Res: DestroyResource
		Size: 10
	Warhead@Scorch: LeaveSmudge
		SmudgeType: Scorch
		ValidTargets: Ground, Infantry
		Size: 6
		Delay: 15
