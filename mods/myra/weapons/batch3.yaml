# Tomahawk: long-range cruise missile. Only at land and sea targets; one every 15 seconds.
Tomahawk:
	Inherits: ^AntiGroundMissile
	ReloadDelay: 375
	Range: 40c0
	MinRange: 0
	Report: missile1.aud
	ValidTargets: Ground, Water, GroundActor, WaterActor
	Projectile: Missile
		Image: tomahawk
		Speed: 300
		CruiseAltitude: 2c0
		RangeLimit: 50c0
		HorizontalRateOfTurn: 40
		Inaccuracy: 128
		TrailImage: smokey
		Blockable: false
	Warhead@1Dam: SpreadDamage
		Spread: 600
		Damage: 25000
		ValidTargets: GroundActor, WaterActor, Trees
		Versus:
			None: 60
			Wood: 100
			Light: 90
			Heavy: 70
			Concrete: 100
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@3Eff: CreateEffect
		Explosions: large_explosion
		ImpactSounds: kaboom12.aud

