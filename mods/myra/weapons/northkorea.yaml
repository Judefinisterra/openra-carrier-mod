# North Korea weapons.

# The Hwasong's nuke: exactly the Typhoon's (same blast, range and reload), with the giant missile in flight.
HwasongNuke:
	Inherits: SubNuke
	Projectile: Bullet
		Image: hwasong-missile

# Hardened Artillery Site: 170mm Koksan gun - very long range, slow, heavy.
Koksan170:
	Inherits: 155mm
	ReloadDelay: 110
	Range: 24c0
	MinRange: 4c0
	Warhead@1Dam: SpreadDamage
		Damage: 22000

# Trash Balloons: junk raining down - light damage over a small area.
TrashDrop:
	ValidTargets: Ground, Water
	Warhead@1Dam: SpreadDamage
		Spread: 1c0
		Damage: 3000
		Versus:
			None: 100
			Wood: 60
			Light: 40
			Heavy: 15
			Concrete: 25
	Warhead@2Eff: CreateEffect
		Explosions: piffs
		ImpactSounds: kaboom12.aud
