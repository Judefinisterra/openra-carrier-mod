# See OpenRA.Mods.MyRA/Traits/AICommander.cs.
World:
	AICommanderOptions:
	# Writes a timeline of every game to Logs/myra-games (see GameRecorder.cs).
	GameRecorder:

Player:
	AICommanderBotModule:
		ReportIntervalSeconds: 30
