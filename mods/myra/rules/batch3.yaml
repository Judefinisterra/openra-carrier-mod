		TurnSpeed: 12
		Speed: 480
		RepulsionSpeed: 40
	PermanentRevealTrail:
		Radius: 8c0
	-WithAmmoPipsDecoration:
	Selectable:
		Bounds: 1792, 1536
	RenderSprites:
		Image: sr71

# P-3 Orion: anti-submarine patrol plane. Spots submarines within 5 cells and drops depth charges on
# them. Send it somewhere and it patrols a figure 8 there, attacking any sub that comes by. Never lands.
P3:
	Inherits: ^NoLandPlane
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Aircraft
		BuildAtProductionType: Plane
		BuildPaletteOrder: 62
		Prerequisites: ~afld, ~techlevel.medium
		Description: actor-p3.description
	Valued:
		Cost: 1500
	Tooltip:
		Name: actor-p3.name
	Health:
		HP: 16000
	RevealsShroud:
		Range: 7c0
		Type: GroundPosition
	Aircraft:
		CruiseAltitude: 2048
		TurnSpeed: 12
		Speed: 170
		RepulsionSpeed: 40
	DetectCloaked:
		DetectionTypes: Underwater
		Range: 5c0
	RenderDetectionCircle:
	Armament:
		Weapon: P3DepthCharge
		PauseOnCondition: !ammo
	AttackAircraft:
		FacingTolerance: 80
		PersistentTargeting: false
		OpportunityFire: False
	AutoTarget:
		InitialStance: AttackAnything
		InitialStanceAI: AttackAnything
	AmmoPool:
		Ammo: 6
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 150
		Count: 1
	Selectable:
		Bounds: 2304, 1792
	RenderSprites:
		Image: kc135

