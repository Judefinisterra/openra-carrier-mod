	Buildable:
		Queue: Aircraft
		BuildAtProductionType: Plane
		BuildPaletteOrder: 61
		Prerequisites: ~afld, ~techlevel.medium
		Description: actor-sr71.description
	Valued:
		Cost: 1800
	Tooltip:
		Name: actor-sr71.name
	Health:
		HP: 8000
	RevealsShroud:
		Range: 10c0
