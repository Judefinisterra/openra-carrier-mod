# C-130 Hercules: lands wherever you send it. Load troops or vehicles while it is on the ground, fly it
# somewhere else, and unload them there.
C130:
	Inherits: ^Plane
	Inherits@CARGOPIPS: ^CargoPips
	Buildable:
		Queue: Aircraft
		BuildAtProductionType: Plane
		BuildPaletteOrder: 64
		Prerequisites: ~afld, ~techlevel.low
		Description: actor-c130.description
	Valued:
		Cost: 1200
	Tooltip:
		Name: actor-c130.name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 20000
	RevealsShroud:
		Range: 6c0
		Type: GroundPosition
	Aircraft:
		CruiseAltitude: 2048
		TurnSpeed: 10
		Speed: 160
		RepulsionSpeed: 40
		LandableTerrainTypes: Clear, Road, Rough, Beach, Ore, Gems
		CanForceLand: true
		TakeOffOnResupply: false
	Cargo:
		Types: Infantry, Vehicle
		MaxWeight: 10
		AfterUnloadDelay: 10
	LandOnMove:
	-SpawnActorOnDeath:
	FireWarheadsOnDeath@AIR:
		Weapon: UnitExplodePlane
		RequiresCondition: airborne
	EjectOnDeath:
		SuccessRate: 100
	Selectable:
		Bounds: 2304, 1792
	RenderSprites:
		Image: c130

# Harrier: jump jet - takes off and lands vertically (helipads, airfields, anywhere). Missiles for air
# and ground targets.
HARRIER:
	Inherits: ^Helicopter
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Buildable:
		Queue: Aircraft
		BuildPaletteOrder: 45
		Prerequisites: anyairpad, ~techlevel.medium
		Description: actor-harrier.description
	Valued:
		Cost: 1400
	Tooltip:
		Name: actor-harrier.name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 9000
	RevealsShroud:
		MinRange: 9c0
		Range: 11c0
		Type: GroundPosition
		RevealGeneratedShroud: False
	Armament@AA:
		Weapon: F14AAM
		LocalOffset: 0,-400,-60, 0,400,-60
		PauseOnCondition: !ammo
	Armament@AG:
		Name: secondary
		Weapon: Maverick
		LocalOffset: 0,-400,-60, 0,400,-60
		PauseOnCondition: !ammo
	AttackAircraft:
		FacingTolerance: 80
		PersistentTargeting: false
		OpportunityFire: False
	Aircraft:
		TurnSpeed: 20
		Speed: 210
		LandableTerrainTypes: Clear, Rough, Road, Ore, Beach, Gems
	AmmoPool:
		Ammo: 6
		AmmoCondition: ammo
	Rearmable:
		RearmActors: hpad, afld, afld.ukraine
	AutoTarget:
		InitialStance: Defend
		InitialStanceAI: AttackAnything
	-WithFacingSpriteBody:
	WithFacingSpriteBody@FLY:
		Sequence: idle
		RequiresCondition: cruising
	WithFacingSpriteBody@HOVER:
		Name: hover
		Sequence: hover
		RequiresCondition: !cruising
	-SpawnActorOnDeath:
	FireWarheadsOnDeath@AIR:
		Weapon: UnitExplodePlane
		RequiresCondition: airborne
	EjectOnDeath:
		SuccessRate: 100
	WithAmmoPipsDecoration:
		Position: BottomLeft
		Margin: 4, 3
		RequiresSelection: true
	RenderSprites:
		Image: harrier

