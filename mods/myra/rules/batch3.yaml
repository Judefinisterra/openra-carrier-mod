# News Helicopter: neutral, wanders the map. What it sees, every player sees.
NEWSHELI:
	Inherits: ^Helicopter
	-Huntable:
	-MustBeDestroyed:
	-EjectOnDeath:
	-ActorLostNotification:
	-Repairable:
	-SpawnActorOnDeath:
	-Capturable:
	-CaptureManager:
	-CaptureNotification:
	Tooltip:
		Name: actor-newsheli.name
	Health:
		HP: 6000
	Aircraft:
		Speed: 110
		CruiseAltitude: 1536
	RevealsShroud:
		Range: 7c0
		Type: GroundPosition
		ValidRelationships: Ally, Neutral, Enemy
	WandersByAir:
	WithIdleOverlay@ROTORAIR:
		Offset: 0,0,85
		Sequence: rotor
		RequiresCondition: airborne
	WithIdleOverlay@ROTORGROUND:
		Offset: 0,0,85
		Sequence: slow-rotor
		RequiresCondition: !airborne
	FireWarheadsOnDeath@AIR:
		Weapon: UnitExplodeHeli
		RequiresCondition: airborne
	RenderSprites:
		Image: newsheli
	MapEditorData:
		Categories: System

