# ---------------------------------------------------------------------------
# Batch 3: B-2, SR-71, KC-135 tanker, AC-130, C-130, Harrier, Apache, News Helicopter, Mobile SAM,
# SEAL Zodiac, Littoral Combat Ship (Tomahawks), Coast Guard cutter, Cop, Sniper, plague, recall panel.
# ---------------------------------------------------------------------------

World:
	PlagueManager:
	RecallPanel:
	NeutralAirSpawner:
		Actor: newsheli

^Infantry:
	Plagueable:
	ChangesHealth@PLAGUE:
		PercentageStep: -1
		Step: 0
		Delay: 40
		StartIfBelow: 101
		RequiresCondition: plague
	WithColoredOverlay@PLAGUE:
		Color: 30C03050
		RequiresCondition: plague

HPAD:
	ProvidesPrerequisite@anyairpad:
		Prerequisite: anyairpad
AFLD:
	ProvidesPrerequisite@anyairpad:
		Prerequisite: anyairpad
SYRD:
	ProvidesPrerequisite@anyshipyard:
		Prerequisite: anyshipyard
SPEN:
	ProvidesPrerequisite@anyshipyard:
		Prerequisite: anyshipyard

# Planes that never land: circle when idle, patrol where they are sent, no rearming on the ground.
^NoLandPlane:
	Inherits: ^Plane
	-Repairable:
	-SpawnActorOnDeath:
	FireWarheadsOnDeath@AIR:
		Weapon: UnitExplodePlane
		RequiresCondition: airborne
	EjectOnDeath:
		SuccessRate: 100
	AirPatrol:
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	WithAmmoPipsDecoration:
		Position: BottomLeft
		Margin: 4, 3
		RequiresSelection: true

# B-2 Spirit: stealth bomber - invisible except for a few seconds after it attacks. V2 rockets in bursts
# of 4; the bomb bay reloads slowly in flight, so it never has to land.
B2:
	Inherits: ^NoLandPlane
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Aircraft
		BuildAtProductionType: Plane
		BuildPaletteOrder: 60
		Prerequisites: ~afld, ~techlevel.high
		Description: actor-b2.description
	Valued:
		Cost: 3000
	Tooltip:
		Name: actor-b2.name
	Health:
		HP: 20000
	RevealsShroud:
		Range: 8c0
		Type: GroundPosition
	Armament:
		Weapon: B2V2
		LocalOffset: 0,-300,-100, 0,300,-100
		PauseOnCondition: !ammo
	AttackAircraft:
		FacingTolerance: 80
		PersistentTargeting: false
		OpportunityFire: False
	Aircraft:
		CruiseAltitude: 3072
		TurnSpeed: 12
		Speed: 170
		RepulsionSpeed: 40
	AutoTarget:
		InitialStance: Defend
		InitialStanceAI: AttackAnything
	AmmoPool:
		Ammo: 8
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 200
		Count: 1
	Cloak:
		InitialDelay: 0
		CloakDelay: 125
		CloakSound: appear1.aud
		UncloakSound: appear1.aud
		UncloakOn: Attack, Unload, Infiltrate, Demolish, Dock, Damage
		IsPlayerPalette: true
	Selectable:
		Bounds: 2560, 1536
		DecorationBounds: 2816, 1792
	RenderSprites:
		Image: b2

# SR-71 Blackbird: faster than any missile, unarmed. Everywhere it flies stays revealed for good.
