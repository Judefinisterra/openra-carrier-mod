# ---------------------------------------------------------------------------
# Israel: an Allied-side country, a clone of England plus the Pager Attack.
#   Everything England gets, Israel gets too (the lists below add israel wherever england appears,
#   including the Armored Bulldozer and the starting nuke).
#   Pager Attack: a support power on the Radar Dome. Click the icon and every enemy infantryman's pager
#   goes off: they all explode a second or two later. Recharges every 6 minutes.
# ---------------------------------------------------------------------------
^BaseWorld:
	Faction@israel:
		Name: faction-israel.name
		InternalName: israel
		Side: Allies
		Description: faction-israel.description

DOME:
	PagerAttackPower@PAGER:
		OrderName: PagerAttack
		Prerequisites: structures.israel
		Icon: pager
		ChargeInterval: 9000
		Name: actor-pager.name
		Description: actor-pager.description
		LaunchSound: pagerbeep.wav
		IncomingSound: pagerbeep.wav
		EndChargeTextNotification: notification-pager-ready
		SupportPowerPaletteOrder: 58

# Generated: every faction list that includes england, with israel added (see the header).
