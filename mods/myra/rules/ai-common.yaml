		ExcludeFromSquadsTypes: protester, protester.hermit, shahed, harv, mcv, e6, dog, badr.bomber, u2, mnly, lst, canoe, oiltruck, oiltanker, containership, supplytruck, decoy.v2, decoy.tank, badr.troop, badr.kamikaze, spy.hermit, oilhauler, doctor, ambulance, whitevan
