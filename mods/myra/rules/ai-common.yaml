# AI overhaul: shared strategy for the four standard AIs (Rush, Normal, Turtle, Naval), plus settings
# every AI uses. The Tribal Warlord and Iranian Command have their own files (tribal-ai.yaml, iran-ai.yaml).
#
# What changed for every AI:
#  - Economy first: two refineries and enough harvesters before a big army; a Service Depot is always kept so a lost
#    Construction Yard can be replaced; yards are never packed up and moved (a second MCV is built instead).
#  - Reacts to the enemy (AdaptiveProductionBotModule): counters what it has seen, anti-air only once aircraft appear.
#  - Squads retreat after losing ~60% of their strength and pick soft targets (harvesters, refineries, power)
#    instead of walking into a wall of defences.
#  - Scouts so it knows where the enemy is; raids with small strike groups; sea invasions on island maps.
Player:
	# ---------------- Rush: early pressure, raids on harvesters, then grows into a normal army ----------------
	GrantConditionAfterTicks@rushlate:
		Condition: rush-late
		Delay: 15000
	BaseBuilderBotModule@rush:
		NewProductionCashThreshold: 3000
		PlaceDefenseTowardsEnemyChance: 90
		BuildingFractions:
			-agun:
			-sam:
		BuildingDelays:
			fix: 1500
	McvExpansionManagerBotModule@rush:
		NeverMoveConyards: true
	SquadManagerBotModule@rush:
		RequiresCondition: enable-rush-ai && !rush-late
		SquadSize: 10
		SquadSizeRandomBonus: 8
		RushInterval: 450
		RetreatLossPercent: 65
		PreferredTargetTypes: harv, oiltruck, proc, oilb.player, oilplatform, powr, apwr, npp, weap, barr, tent, kenn, fact
		PreferredTargetRadius: 18
		DefendedTargetPenalty: 3
		NavalUnitsTypes: ss, msub, dd, ca, pt, fab
		ExcludeFromSquadsTypes: protester, protester.hermit, shahed, harv, mcv, e6, dog, badr.bomber, u2, lst, canoe, oiltruck, oiltanker, containership, supplytruck, decoy.v2, decoy.tank, badr.troop, badr.kamikaze, spy.hermit, oilhauler, doctor, ambulance, whitevan
		ProtectionTypes: harv, mcv, mslo, gap, spen, syrd, iron, pdox, tsla, agun, dome, pbox, hbox, gun, ftur, sam, atek, weap, fact, proc, silo, hpad, afld, afld.ukraine, powr, apwr, npp, stek, barr, kenn, tent, fix, spire, fantasy, oilb.player, oilplatform, oiltruck, oiltanker
	SquadManagerBotModule@rushlate:
		RequiresCondition: enable-rush-ai && rush-late
		SquadSize: 20
		SquadSizeRandomBonus: 10
		RushInterval: 1200
		RetreatLossPercent: 60
		PreferredTargetTypes: harv, oiltruck, proc, oilb.player, oilplatform, powr, apwr, npp, weap, barr, tent, kenn, fact
		PreferredTargetRadius: 18
		DefendedTargetPenalty: 3
		NavalUnitsTypes: ss, msub, dd, ca, pt, fab
		ExcludeFromSquadsTypes: protester, protester.hermit, shahed, harv, mcv, e6, dog, badr.bomber, u2, lst, canoe, oiltruck, oiltanker, containership, supplytruck, decoy.v2, decoy.tank, badr.troop, badr.kamikaze, spy.hermit, oilhauler, doctor, ambulance, whitevan
		ConstructionYardTypes: fact
		NavalProductionTypes: spen, syrd
		AirUnitsTypes: mig, yak, heli, hind, mh60, subcarrier.heli
		AircraftTargetType: AirborneActor
		ProtectionTypes: harv, mcv, mslo, gap, spen, syrd, iron, pdox, tsla, agun, dome, pbox, hbox, gun, ftur, sam, atek, weap, fact, proc, silo, hpad, afld, afld.ukraine, powr, apwr, npp, stek, barr, kenn, tent, fix, spire, fantasy, oilb.player, oilplatform, oiltruck, oiltanker
		IgnoredEnemyTargetTypes: AirborneActor
	UnitBuilderBotModule@rush:
		RequiresCondition: enable-rush-ai && !rush-late
	UnitBuilderBotModule@rushlate:
		RequiresCondition: enable-rush-ai && rush-late
		UnitsToBuild:
			e1: 40
			e3: 30
			e4: 10
			shok: 10
			harv: 10
			apc: 15
			jeep: 15
			arty: 15
			v2rl: 25
			ftrk: 20
			1tnk: 30
			2tnk: 50
			3tnk: 50
			4tnk: 20
			ttnk: 20
			heli: 20
			mh60: 20
			mig: 15
			yak: 20
		UnitLimits:
			dog: 4
			harv: 8
			jeep: 4
			ftrk: 6
	StrikeGroupBotModule@rushraid:
		RequiresCondition: (enable-rush-ai) && !ai-easy
		UnitTypes: jeep, 1tnk, ftrk, apc
		MinGroupSize: 3
		MaxGroupSize: 6
		Interval: 1100
		TargetTypes: harv, oiltruck, proc, oilb.player, powr, apwr
		AvoidDefenses: true
		RetreatLossPercent: 50
	AdaptiveProductionBotModule@rush:
		RequiresCondition: (enable-rush-ai) && !ai-easy
		EarlyGameTicks: 0
		AntiAirUnits: e3, ftrk
		AntiArmorUnits: e3, 1tnk, 2tnk, 3tnk
		AntiInfantryUnits: e1, e4, jeep, ftrk
		AntiNavalUnits: ss, pt, dd
		AntiAirDefenses: agun, sam
