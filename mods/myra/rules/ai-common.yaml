	# ---------------- Shared modules, switched on for all six AIs ----------------
	ResourceMapBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-naval-ai || enable-tribal-ai || enable-iran-ai || enable-hermit-ai || enable-stable-ai
	SupportPowerBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-naval-ai || enable-tribal-ai || enable-iran-ai || enable-hermit-ai || enable-stable-ai
		# Nukes go where they hurt most: dense clusters of buildings and armies, never near our own forces.
		Decisions:
			cyberattack:
				OrderName: CyberAttack
				MinimumAttractiveness: 1
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: Value
					CheckRadius: 6c0
			hermitcyber:
				OrderName: HermitCyberAttack
				MinimumAttractiveness: 1
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: Value
					CheckRadius: 6c0
			hermitpsyop:
				OrderName: HermitPsyOp
