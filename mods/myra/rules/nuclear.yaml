# No more starting A-bomb on the Construction Yard: nukes come only from the nuclear program.
FACT:
	NukePower@UKRAINE:
		Prerequisites: ~disabled

# Trees caught by a nuke burn black and smoke for minutes, but stay standing.
^Tree:
	Scorchable:
