# --- An-2 biplane + special forces ---------------------------------------------------------------------
# Slow wooden biplane flying very low: not on radar and invisible to the enemy until something is within 3 cells
# of it, so SAM sites rarely get a shot. Comes loaded with 6 special forces: right-click anywhere and they jump.
AN2:
	Inherits: ^Plane
	Inherits@CARGOPIPS: ^CargoPips
	Buildable:
		Queue: Aircraft
		BuildAtProductionType: Plane
		BuildPaletteOrder: 24
		Prerequisites: ~afld, ~hermitnation, ~techlevel.medium
		Description: actor-an2.description
	Valued:
		Cost: 1400
	Tooltip:
		Name: actor-an2.name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 9000
	Armor:
		Type: Light
	RevealsShroud:
		Range: 6c0
		Type: GroundPosition
	Aircraft:
		CruiseAltitude: 900
		TurnSpeed: 16
		Speed: 120
		RepulsionSpeed: 40
		IdleBehavior: ReturnToBase
	-AppearsOnRadar:
	-SpawnActorOnDeath:
	FireWarheadsOnDeath@AIR:
		Weapon: UnitExplodePlane
		RequiresCondition: airborne
	Cloak@LOWFLYER:
		DetectionTypes: LowFlyer
		InitialDelay: 0
		CloakDelay: 50
		UncloakOn: Unload, Dock
	Cargo:
		Types: Infantry
		MaxWeight: 6
		InitialUnits: nksf, nksf, nksf, nksf, nksf, nksf
	ParaDrop:
		DropRange: 3c0
		ChuteSound: chute1.aud
	ParaDropOnOrder:
	Rearmable:
		RearmActors: afld, afld.ukraine
	Selectable:
		DecorationBounds: 1536, 1536
	RenderSprites:
		Image: an2

NKSF:
	Inherits: E1
	-Buildable:
	Tooltip:
		Name: actor-nksf.name
	Valued:
		Cost: 200
	Health:
		HP: 8000
	Armament@PRIMARY:
		Weapon: BodyguardSMG
	Armament@GARRISONED:
		Weapon: BodyguardSMG
	RenderSprites:
		Image: e1

