	Valued:
		Cost: 2000
	Tooltip:
		Name: actor-juche.name
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	-GivesBuildableArea:
	Health:
		HP: 100000
	Armor:
		Type: Concrete
