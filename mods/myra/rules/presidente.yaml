# El Presidente game mode (OpenRA.Mods.MyRA/Traits/Presidente.cs). Lobby checkbox, off by default.
World:
	PresidenteManager:

Player:
	PresidenteBotModule:

# Presidential limousine: an APC (speed, machine gun, carries 5) with heavy-tank armour. Not buildable.
LIMO:
	Inherits: APC
	-Buildable:
	-ProducibleWithLevel:
	-WithProductionIconOverlay:
	-WithMuzzleOverlay:
	Valued:
		Cost: 2000
	Tooltip:
		Name: actor-limo.name
	Health:
		HP: 60000
	Armor:
		Type: Heavy
	AutoTarget:
		InitialStanceAI: Defend
	-Armament:
	Armament@LIMO:
		Weapon: M60mg
		LocalOffset: 85,0,171
	RenderSprites:
		Image: limo
	MapEditorData:
		Categories: System

# El Presidente: bright orange suit, unarmed. If he dies, his owner loses.
PRESIDENTE:
	Inherits: ^Infantry
	Valued:
		Cost: 5000
	Tooltip:
		Name: actor-presidente.name
	Health:
		HP: 6000
	Passenger:
		CustomPipType: yellow
	Voiced:
		VoiceSet: CivilianMaleVoice
	WithInfantryBody:
		IdleSequences: idle1
	Presidente:
	RenderSprites:
		Image: presidente
	MapEditorData:
		Categories: System

# Bodyguard: black suit and shades, submachine gun. Follows El Presidente when idle.
BODYGUARD:
	Inherits: E1
	-Buildable:
	Valued:
		Cost: 400
	Tooltip:
		Name: actor-bodyguard.name
	Health:
		HP: 7500
	Armament@PRIMARY:
		Weapon: BodyguardColt
	Armament@GARRISONED:
		Weapon: BodyguardColt
	Bodyguard:
	AutoTarget:
		InitialStanceAI: Defend
	RenderSprites:
		Image: bodyguard
	MapEditorData:
		Categories: System

World:
	VipLockdown:

Player:
	PresidenteModePrerequisite:

# VIP Bunker (El Presidente games only): a fortified mountain (4x4 cells) with a tunnel and a blast door. El Presidente
# and his bodyguards can shelter inside - the door slams shut behind him. It shrugs off a nuke, but while he's in there
# his side can't build anything and can't load any transports. Select it and unload to bring him back out.
VIPBUNKER:
	Inherits: ^Building
	Buildable:
		Queue: Defense
		BuildPaletteOrder: 98
		Prerequisites: presidentemode, ~techlevel.infonly
		BuildLimit: 1
		Description: actor-vipbunker.description
	Valued:
		Cost: 2500
	Tooltip:
		Name: actor-vipbunker.name
	Building:
		Footprint: xxxx xxxx xxxx xxxx
		Dimensions: 4,4
	HitShape:
		Type: Rectangle
			TopLeft: -2048, -2048
			BottomRight: 2048, 2048
	-GivesBuildableArea:
	Health:
		HP: 300000
	Armor:
		Type: Concrete
	# Built to take a nuclear blast: 95% of all damage is soaked up.
	DamageMultiplier@bunker:
		Modifier: 5
	RevealsShroud:
		Range: 6c0
	Cargo:
		Types: Infantry
		MaxWeight: 5
		AllowedPassengers: presidente, bodyguard
		EjectOnSell: true
		EjectOnDeath: true
		EjectSearchRadius: 3
		LoadingCondition: loading
		PassengerConditions:
			presidente: vipinside
	WithCargoPipsDecoration:
		PipCount: 5
		RequiresSelection: true
	# The blast door: open, or shut while El Presidente is inside.
	WithSpriteBody:
		RequiresCondition: !vipinside
	WithSpriteBody@closed:
		Name: closed
		Sequence: closed
		RequiresCondition: vipinside
	WithMakeAnimation:
		BodyNames: body, closed
	VipBunker:
	-MustBeDestroyed:
	Selectable:
		Bounds: 4096, 4096
		DecorationBounds: 4096, 4608, 0, -512
	RenderSprites:
		Image: vipbunker
