# Fortress (internal name FANTASY, formerly "PJ's Fantasy Factory"): a Cold War concrete command bunker (3x3).
# While you own one, you can build the custom units. Armed with 5 Tesla coils (four on the deck corners, one on
# the command tower), 6 machine guns behind the firing slits and 10 SAM launchers on the roof.
FANTASY:
	Inherits: ^Building
	Buildable:
		Queue: Building
		BuildPaletteOrder: 16
		Description: actor-fantasy.description
	Valued:
		Cost: 350
	Tooltip:
		Name: actor-fantasy.name
	Building:
		Footprint: xxx xxx xxx
		Dimensions: 3,3
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -1536, -1536
			BottomRight: 1536, 1536
	Health:
		HP: 200000
	Armor:
		Type: Heavy
	RevealsShroud:
		Range: 8c0
	ProvidesPrerequisite@FANTASY:
		Prerequisite: fantasyfactory
	Selectable:
		Bounds: 3072, 4096, 0, -512
		DecorationBounds: 3072, 4096, 0, -512
	RenderSprites:
		Image: fantasyfactory
	RenderRangeCircle:
		RangeCircleType: aa
	AutoTarget:
	AutoTargetPriority@GROUND:
		ValidTargets: Infantry, Vehicle, Ship, Underwater
		InvalidTargets: NoAutoTarget
	AutoTargetPriority@AIR:
		ValidTargets: AirborneActor
		InvalidTargets: NoAutoTarget
	AttackOmni:
		Armaments: tesla1, tesla2, tesla3, tesla4, tesla5, pillbox1, pillbox2, pillbox3, pillbox4, pillbox5, pillbox6, sam1, sam2, sam3, sam4, sam5, sam6, sam7, sam8, sam9, sam10
		RequiresCondition: !build-incomplete
