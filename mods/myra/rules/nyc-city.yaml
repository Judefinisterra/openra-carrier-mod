# Generated by gen_nyc.py: New York City buildings, landmarks, bridges and repair huts.
^NycBuilding:
	Inherits: ^CivBuilding
	Inherits@AUTOTARGET: ^AutoTargetGround
	Inherits@CARGOPIPS: ^CargoPips
	Tooltip:
		GenericVisibility: None
	Health:
		HP: 60000
	Armor:
		Type: Concrete
	Building:
		TerrainTypes: Clear, Road, Rough, Beach
	Cargo:
		Types: Infantry
		MaxWeight: 4
		EnterableWhenNeutral: true
		UnloadVoice: Move
	Garrisonable:
	Turreted:
		TurnSpeed: 512
	AttackGarrisoned:
		Armaments: garrisoned
		PortOffsets: 0,0,1024, 0,0,1024, 0,0,1024, 0,0,1024
		PortYaws: 0, 256, 512, 768
		PortCones: 136, 136, 136, 136
	RenderRangeCircle:
		FallbackRange: 6c0
	-FireWarheadsOnDeath@CIVPANIC:
	MapEditorData:
		Categories: New York City

