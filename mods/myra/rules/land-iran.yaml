# ---------------------------------------------------------------------------
# Iran land units and buildings (Iran only):
#   Technical (machine gun) and Rocket Technical   Inflatable decoys (fake V2 launchers and tanks)
#   Shahed Launch Truck                             Tunnel Network
#   Missile City superweapon                        Burning oil when derricks, platforms or tankers die (everyone)
# ---------------------------------------------------------------------------

# Technical: a pickup truck with a heavy machine gun. Cheap, very fast, fragile. Can use the tunnels.
TECHNICAL:
	Inherits: ^Vehicle
	Inherits@GAINSEXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 16
		Prerequisites: ~vehicles.soviet, ~iranfaction
		Description: actor-technical.description
	Valued:
		Cost: 350
	Tooltip:
		Name: actor-technical.name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 12000
	Armor:
		Type: Light
	Mobile:
		Speed: 175
		TurnSpeed: 40
	RevealsShroud:
		MinRange: 4c0
		Range: 7c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	Turreted:
		TurnSpeed: 40
	Armament:
		Weapon: TechnicalMG
		LocalOffset: -200,0,350
	AttackTurreted:
	Passenger:
		CargoType: TunnelVehicle
	Selectable:
		DecorationBounds: 1024, 1024
	RenderSprites:
		Image: technical

# Rocket Technical: the same pickup with a rocket pod. Good against tanks and buildings.
TECHNICAL.RPG:
	Inherits: TECHNICAL
	Buildable:
		BuildPaletteOrder: 17
		Description: actor-technicalrpg.description
	Valued:
		Cost: 450
	Tooltip:
		Name: actor-technicalrpg.name
	Armament:
		Weapon: TechnicalRockets
		LocalOffset: -300,0,300
	RenderSprites:
		Image: technicalrpg

# Inflatable decoys: look exactly like the real thing to the enemy, but have no weapons and pop easily.
DECOY.V2:
	Inherits: ^Vehicle
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 231
		Prerequisites: ~vehicles.soviet, ~iranfaction
		Description: actor-decoy-v2.description
	Valued:
		Cost: 75
	Tooltip:
		Name: actor-v2rl.name
	TooltipDescription@ally:
		Description: actor-decoy.ally-description
		ValidRelationships: Ally
	Health:
		HP: 3000
	Armor:
		Type: Light
	Mobile:
		Speed: 72
	RevealsShroud:
		Range: 4c0
	FireWarheadsOnDeath:
		Weapon: DecoyPop
		EmptyWeapon: DecoyPop
	-MustBeDestroyed:
	Selectable:
		DecorationBounds: 1194, 1194
	RenderSprites:
		Image: decoyv2

DECOY.TANK:
	Inherits: ^TrackedVehicle
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 232
		Prerequisites: ~vehicles.soviet, ~iranfaction
		Description: actor-decoy-tank.description
	Valued:
		Cost: 100
	Tooltip:
		Name: actor-3tnk.name
		GenericName: actor-3tnk.generic-name
	TooltipDescription@ally:
		Description: actor-decoy.ally-description
		ValidRelationships: Ally
	Health:
		HP: 4000
	Armor:
		Type: Light
	Mobile:
		Speed: 64
	RevealsShroud:
		Range: 4c0
	Turreted:
		TurnSpeed: 20
	WithSpriteTurret:
	Armament:
		Weapon: DecoyNothing
	AttackTurreted:
	FireWarheadsOnDeath:
		Weapon: DecoyPop
		EmptyWeapon: DecoyPop
	-MustBeDestroyed:
	Selectable:
		DecorationBounds: 1194, 1194
	RenderSprites:
		Image: decoytank

# Shahed Launch Truck: carries 5 Shahed drones on a rack. Order it to attack anything up to 14 cells away
# and it launches the whole rack at it; the rack reloads in 30 seconds.
DRONETRUCK:
	Inherits: ^Vehicle
	Inherits@GAINSEXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 233
		Prerequisites: dome, ~vehicles.soviet, ~iranfaction
		Description: actor-dronetruck.description
	Valued:
		Cost: 1200
	Tooltip:
		Name: actor-dronetruck.name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 25000
	Armor:
		Type: Light
	Mobile:
		Speed: 80
	RevealsShroud:
		MinRange: 4c0
		Range: 6c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	Armament:
		Weapon: DroneLaunch
	AttackFrontal:
		FacingTolerance: 512
		TargetFrozenActors: True
		ForceFireIgnoresActors: True
	AutoTarget:
		ScanRadius: 12
		InitialStance: Defend
		InitialStanceAI: AttackAnything
	DroneLauncher:
		Drone: shahed
		Count: 5
		ReloadTicks: 750
	WithFacingSpriteBody:
		RequiresCondition: !rack-empty
		Name: loaded
	WithFacingSpriteBody@EMPTY:
		RequiresCondition: rack-empty
		Sequence: empty-idle
		Name: empty
	FireWarheadsOnDeath:
		Weapon: V2Explode
	Selectable:
		DecorationBounds: 1536, 1536
	RenderSprites:
		Image: dronetruck

# Tunnel Network: build two (or more) entrances. Infantry, jeeps and technicals that enter one come out of the
# next entrance a couple of seconds later.
TUNNEL:
	Inherits: ^Building
	Inherits@shape: ^2x2Shape
	Inherits@CARGOPIPS: ^CargoPips
	Buildable:
		Queue: Building
		BuildPaletteOrder: 48
		Prerequisites: barr, ~iranfaction
		Description: actor-tunnel.description
	Valued:
		Cost: 600
	Tooltip:
		Name: actor-tunnel.name
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	-GivesBuildableArea:
	-SpawnActorsOnSell:
	Health:
		HP: 60000
	Armor:
		Type: Concrete
	RevealsShroud:
		Range: 5c0
	Power:
		Amount: -10
	Cargo:
		Types: Infantry, TunnelVehicle
		MaxWeight: 50
		EjectOnDeath: true
		EjectOnSell: true
	TunnelNetwork:
		TravelTicks: 50
	Selectable:
		Bounds: 2048, 2048
	RenderSprites:
		Image: tunnel

JEEP.IRAN:
	Passenger:
		CargoType: TunnelVehicle

LST:
	Cargo:
		Types: Infantry, Vehicle, TunnelVehicle

# Missile City: a hardened underground missile base. Every 4 minutes it can fire a volley of 8 ballistic
# missiles at any area on the map.
MISSILECITY:
	Inherits: ^ScienceBuilding
	Inherits@IDISABLE: ^DisableOnLowPowerOrPowerDown
	Inherits@shape: ^3x2Shape
	Selectable:
		Bounds: 3072, 2048
	Valued:
		Cost: 2500
	Tooltip:
		Name: actor-missilecity.name
	Buildable:
		Queue: Defense
		BuildPaletteOrder: 141
		Prerequisites: techcenter, ~iranfaction, ~techlevel.unrestricted
		BuildLimit: 1
		Description: actor-missilecity.description
	Building:
		Footprint: xxx xxx
		Dimensions: 3,2
	Health:
		HP: 140000
	Armor:
		Type: Concrete
	RevealsShroud:
		Range: 6c0
	Power:
		Amount: -150
	MissileVolleyPower@volley:
		PauseOnCondition: disabled
		OrderName: MissileVolley
		Cursor: nuke
		Icon: missilevolley
		ChargeInterval: 6000
		Weapon: MissileCityRocket
		Count: 8
		Interval: 6
		Name: actor-missilecity.power-name
		Description: actor-missilecity.power-description
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: notification-select-target
		InsufficientPowerSpeechNotification: InsufficientPower
		InsufficientPowerTextNotification: notification-insufficient-power
		DisplayRadarPing: true
		SupportPowerPaletteOrder: 62
	SupportPowerChargeBar:
	RenderSprites:
		Image: missilecity

# ---------------------------------------------------------------------------
# Burning oil: when an Oil Derrick, Offshore Oil Platform or Oil Tanker is destroyed, the oil keeps burning
# for 30 seconds. Nothing can pass through the fire and anything right next to it gets burned.
OILFIRE:
	Inherits: ^SpriteActor
	-QuantizeFacingsFromSequence:
	BodyOrientation:
		QuantizedFacings: 1
	Interactable:
		Bounds: 2048, 2048
	HiddenUnderFog:
	Building:
		Footprint: xx xx
		Dimensions: 2,2
		TerrainTypes: Clear, Road, Rough, Water, Beach, Ore, Gems
	KillsSelf:
		Delay: 750
		RemoveInstead: true
	PeriodicWeapon:
		Weapon: OilFireBurn
		Interval: 20
	Tooltip:
		Name: actor-oilfire.name
	WithSpriteBody:
		Sequence: loop
	WithIdleOverlay@2:
		Image: burn-m
		Sequence: loop
		Offset: -512,-256,0
	WithIdleOverlay@3:
		Image: burn-m
		Sequence: loop
		Offset: 448,320,0
	WithIdleOverlay@4:
		Image: burn-s
		Sequence: loop
		Offset: 512,-448,0
	RenderSprites:
		Image: burn-l
	MapEditorData:
		Categories: System

OILFIRE.SMALL:
	Inherits: OILFIRE
	Interactable:
		Bounds: 1024, 1024
	Building:
		Footprint: x
		Dimensions: 1,1
	-WithIdleOverlay@3:
	-WithIdleOverlay@4:
	WithIdleOverlay@2:
		Image: burn-s
		Offset: 0,0,0

OILB:
	SpawnActorOnDeath@oilfire:
		Actor: oilfire
		OwnerType: InternalName
		InternalOwner: Neutral

OILPLATFORM:
	SpawnActorOnDeath@oilfire:
		Actor: oilfire
		OwnerType: InternalName
		InternalOwner: Neutral

OILTANKER:
	SpawnActorOnDeath@oilfire:
		Actor: oilfire.small
		OwnerType: InternalName
		InternalOwner: Neutral
