# Skyview tower: launches 5 satellites (rules/skydefense.yaml) that sweeps the map for its team.
SPIRE:
	Inherits: ^Building
	Inherits@shape: ^2x2Shape
	Buildable:
		Queue: Building
		BuildPaletteOrder: 15
		Description: actor-spire.description
	Valued:
		Cost: 300
	Tooltip:
		Name: actor-spire.name
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	Health:
		HP: 100000
	Armor:
		Type: Heavy
	RevealsShroud:
		Range: 6c0
	SatelliteLauncher:
		Actor: satellite
		Count: 5
	Selectable:
		Bounds: 2048, 3072, 0, -512
		DecorationBounds: 2048, 3072, 0, -512
	RenderSprites:
		Image: spire
